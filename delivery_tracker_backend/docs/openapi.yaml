openapi: 3.0.0
info:
  title: Delivery Tracker API
  version: 1.0.0
  description: RESTful API for managing deliveries, status updates, and history.
servers:
  - url: http://localhost:3001
paths:
  /:
    get:
      summary: Health endpoint
      tags: [Health]
      responses:
        '200':
          description: OK
  /deliveries:
    post:
      summary: Create a new delivery
      tags: [Deliveries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender, recipient, address, packageDetails, expectedDeliveryDate]
              properties:
                sender: { type: string }
                recipient: { type: string }
                address: { type: string }
                packageDetails:
                  type: object
                  additionalProperties: true
                expectedDeliveryDate:
                  type: string
                  format: date-time
                note:
                  type: string
      responses:
        '201':
          description: Created
    get:
      summary: List deliveries with filters and pagination
      tags: [Deliveries]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: recipient
          schema: { type: string }
        - in: query
          name: startDate
          schema: { type: string, format: date-time }
        - in: query
          name: endDate
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
  /deliveries/{id}:
    get:
      summary: Get a delivery by id
      tags: [Deliveries]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
  /deliveries/{id}/status:
    patch:
      summary: Update delivery status
      tags: [Deliveries]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [created, dispatched, in_transit, out_for_delivery, delivered, failed]
                note:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Validation error
        '404':
          description: Not Found
  /deliveries/{id}/history:
    get:
      summary: Get delivery history
      tags: [Deliveries]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
  /seed:
    post:
      summary: Seed sample deliveries
      tags: [Deliveries]
      responses:
        '201':
          description: Seeded
components: {}
tags:
  - name: Health
  - name: Deliveries
